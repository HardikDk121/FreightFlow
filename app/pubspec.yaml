name: freightflow
description: FreightFlow AI mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.0
  flutter_secure_storage: 11.2.0
  google_fonts: ^6.2.0
  image_picker: ^1.1.0
  # 13.x builds under Flutter's built-in Kotlin (8.x to 11.x fail: "cannot find symbol FilePickerPlugin").
  file_picker: ^13.1.0
  geolocator: ^13.0.0
  shared_preferences: ^2.3.0
  # 13.2+ supports Flutter's built-in Kotlin (older versions apply the Kotlin Gradle Plugin).
  share_plus: ^13.2.1
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_lints: ^4.0.0
  # Generates the phone's app icons from assets/icon: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# The app icon on users' phones (the F with the truck, on black).
flutter_launcher_icons:
  android: true
  ios: true
  # iOS and older Android: the full square; the phone rounds the corners itself.
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  # Android 8 and later: black background with the artwork inside the safe zone, so round,
  # squircle and teardrop launcher shapes never clip it.
  adaptive_icon_background: "#0B0B0F"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # Android 13 themed icons.
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
