[project]
name = "freightflow-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.15",
    "reportlab>=4.0",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pypdf>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.auth", "app.users", "app.company", "app.masterdata", "app.lr", "app.dispatch", "app.planner", "app.scan", "app.chat", "app.dashboard", "app.reports", "app.eway", "app.rates", "app.payments", "app.collections", "app.bank", "app.delivery", "app.analytics", "app.hire"]

[tool.setuptools.package-data]
"app.lr" = ["*.json"]
