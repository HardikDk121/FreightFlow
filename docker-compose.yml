services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FF_OWNER_PASSWORD: ${FF_OWNER_PASSWORD}
      FF_APP_PASSWORD: ${FF_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freightflow"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      FF_ENV: ${FF_ENV:-production}
      FF_HTTPS: ${FF_HTTPS:-true}
      FF_FORWARDED_ALLOW_IPS: ${FF_FORWARDED_ALLOW_IPS:-*}
      FF_DATABASE_URL: postgresql+psycopg://freightflow_app:${FF_APP_PASSWORD}@db/freightflow
      FF_MIGRATION_DATABASE_URL: postgresql+psycopg://freightflow_owner:${FF_OWNER_PASSWORD}@db/freightflow
      FF_JWT_SECRET: ${FF_JWT_SECRET}
      FF_SMTP_HOST: ${FF_SMTP_HOST:-}
      FF_SMTP_PORT: ${FF_SMTP_PORT:-587}
      FF_SMTP_USER: ${FF_SMTP_USER:-}
      FF_SMTP_PASSWORD: ${FF_SMTP_PASSWORD:-}
      FF_SMTP_FROM: "${FF_SMTP_FROM:-FreightFlow <no-reply@freightflow.local>}"
      FF_LLM_API_KEY: ${FF_LLM_API_KEY:-}
      FF_LLM_MODEL: ${FF_LLM_MODEL:-claude-haiku-5-5}
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config: